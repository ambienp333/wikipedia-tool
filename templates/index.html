<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Topic Graph</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111111;
            color: #c0c0c0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        #sidebar {
            width: 260px;
            flex-shrink: 0;
            height: 100vh;
            background: #181818;
            padding: 20px 16px;
            border-right: 1px solid #282828;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 13px;
            font-weight: 600;
            color: #e0e0e0;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .field { margin-bottom: 12px; }

        label {
            display: block;
            font-size: 10px;
            color: #555555;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 5px;
        }

        textarea, input[type="number"], select {
            width: 100%;
            background: #141414;
            border: 1px solid #2e2e2e;
            color: #c0c0c0;
            padding: 7px 9px;
            border-radius: 3px;
            font-size: 12px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }

        textarea:focus, input:focus, select:focus { border-color: #606060; }
        textarea { height: 110px; resize: vertical; line-height: 1.5; }

        button {
            width: 100%;
            margin-top: 4px;
            padding: 9px;
            background: #333333;
            color: #e0e0e0;
            border: 1px solid #444444;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover:not(:disabled) { background: #444444; }
        button:disabled { background: #1e1e1e; color: #444444; border-color: #2a2a2a; cursor: not-allowed; }

        #status {
            margin-top: 10px;
            font-size: 11px;
            color: #555555;
            min-height: 16px;
            text-align: center;
        }

        #legend {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid #242424;
        }

        .legend-label {
            font-size: 10px;
            color: #484848;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 8px;
            font-size: 11px;
            color: #707070;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .legend-line {
            width: 22px;
            height: 2px;
            flex-shrink: 0;
            border-radius: 1px;
        }

        .legend-score {
            margin-top: 12px;
            font-size: 10px;
            color: #404040;
            line-height: 1.7;
        }

        #graph {
            flex: 1;
            height: 100vh;
            position: relative;
        }

        svg { width: 100%; height: 100%; }

        .node text {
            pointer-events: none;
            user-select: none;
        }

        #overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
        }

        #overlay.visible { display: flex; }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid #2a2a2a;
            border-top-color: #888888;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .overlay-text { font-size: 13px; color: #888888; }
        .overlay-sub  { font-size: 11px; color: #444444; }

        #empty {
            display: none;
            position: absolute;
            inset: 0;
            align-items: center;
            justify-content: center;
            color: #333333;
            font-size: 13px;
            flex-direction: column;
            gap: 8px;
        }

        #empty.visible { display: flex; }
    </style>
</head>
<body>

<div id="sidebar">
    <h1>Wikipedia Graph</h1>

    <div class="field">
        <label>Seed Topics (one per line)</label>
        <textarea id="topics" placeholder="Genetics&#10;Epigenetics&#10;Molecular biology">Genetics
Epigenetics
Molecular biology</textarea>
    </div>

    <div class="field">
        <label>Crawl Depth</label>
        <select id="depth">
            <option value="2">2 — faster</option>
            <option value="3" selected>3 — recommended</option>
            <option value="4">4 — slow</option>
        </select>
    </div>

    <div class="field">
        <label>Links per Page</label>
        <input type="number" id="links" value="10" min="5" max="20">
    </div>

    <div class="field">
        <label>Max Nodes to Show</label>
        <input type="number" id="topN" value="120" min="20" max="300">
    </div>

    <button id="crawlBtn" onclick="runCrawl()">Build Graph</button>
    <div id="status"></div>

    <div id="legend">
        <div class="legend-label">Nodes</div>
        <div class="legend-item">
            <div class="legend-dot" style="background:#f0f0f0;"></div>
            Seed topic
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:#888888;"></div>
            Hub (top 20% score)
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:#383838;"></div>
            Node
        </div>

        <div class="legend-label" style="margin-top:14px;">Edges</div>
        <div class="legend-item">
            <div class="legend-line" style="background:#666666;"></div>
            Bidirectional
        </div>
        <div class="legend-item">
            <div class="legend-line" style="background:#2a2a2a;"></div>
            Unidirectional
        </div>

        <div class="legend-score">
            Score = 50% cross-seed coverage<br>
            + 30% topic specificity<br>
            + 20% bidirectional ratio
        </div>
    </div>
</div>

<div id="graph">
    <div id="overlay">
        <div class="spinner"></div>
        <div class="overlay-text">Crawling Wikipedia…</div>
        <div class="overlay-sub">This may take 1–2 minutes</div>
    </div>
    <div id="empty" class="visible">
        <div>No graph loaded</div>
        <div style="font-size:11px;color:#2a2a2a">Enter seed topics and click Build Graph</div>
    </div>
</div>

<script>
function setStatus(msg) {
    document.getElementById("status").textContent = msg;
}

function setLoading(on) {
    document.getElementById("overlay").classList.toggle("visible", on);
    document.getElementById("crawlBtn").disabled = on;
}

async function runCrawl() {
    const topics = document.getElementById("topics").value
        .split("\n").map(t => t.trim()).filter(Boolean);

    if (!topics.length) { setStatus("Enter at least one topic."); return; }

    const depth        = parseInt(document.getElementById("depth").value);
    const linksPerPage = parseInt(document.getElementById("links").value);
    const topN         = parseInt(document.getElementById("topN").value);

    setLoading(true);
    setStatus("Crawling…");
    document.getElementById("empty").classList.remove("visible");

    try {
        const resp = await fetch("/crawl", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topics, depth, links_per_page: linksPerPage, top_n: topN })
        });
        const data = await resp.json();

        if (data.error) {
            setStatus("Error: " + data.error);
            document.getElementById("empty").classList.add("visible");
        } else {
            setStatus(`${data.nodes.length} nodes · ${data.links.length} edges`);
            renderGraph(data);
        }
    } catch (e) {
        setStatus("Error: " + e.message);
    } finally {
        setLoading(false);
    }
}

function nodeRadius(d) {
    if (d.type === "seed") return 18;
    const s = Math.min(d.score, 1.0);
    if (d.type === "hub")  return 8  + s * 10;
    return 3 + s * 7;
}

function nodeColor(d) {
    if (d.type === "seed") return "#f0f0f0";
    if (d.type === "hub")  return "#888888";
    return "#383838";
}

function labelColor(d) {
    if (d.type === "seed") return "#ffffff";
    if (d.type === "hub")  return "#aaaaaa";
    return "#555555";
}

function renderGraph(data) {
    d3.select("#graph svg").remove();
    document.getElementById("empty").classList.remove("visible");

    const container = document.getElementById("graph");
    const W = container.clientWidth;
    const H = container.clientHeight;

    const svg = d3.select("#graph").append("svg");
    const g   = svg.append("g");

    svg.call(
        d3.zoom().scaleExtent([0.08, 8])
          .on("zoom", e => g.attr("transform", e.transform))
    );

    const nodes = data.nodes.map(d => ({ ...d }));
    const links = data.links.map(d => ({ ...d }));

    const sim = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(d => {
            const s = typeof d.source === "object" ? d.source.type : "node";
            const t = typeof d.target === "object" ? d.target.type : "node";
            if (s === "seed" || t === "seed") return 160;
            if (s === "hub"  || t === "hub")  return 100;
            return 65;
        }))
        .force("charge", d3.forceManyBody().strength(d => {
            if (d.type === "seed") return -900;
            if (d.type === "hub")  return -350;
            return -100;
        }))
        .force("center", d3.forceCenter(W / 2, H / 2))
        .force("collision", d3.forceCollide().radius(d => nodeRadius(d) + 5));

    const link = g.append("g").selectAll("line")
        .data(links).join("line")
        .attr("stroke",         d => d.bidirectional ? "#595959" : "#252525")
        .attr("stroke-width",   d => d.bidirectional ? 1.5 : 0.8)
        .attr("stroke-opacity", d => d.bidirectional ? 0.9 : 0.6);

    const node = g.append("g").selectAll("g")
        .data(nodes).join("g")
        .call(drag(sim));

    node.append("circle")
        .attr("r",            nodeRadius)
        .attr("fill",         nodeColor)
        .attr("fill-opacity", d => d.type === "node" ? 0.7 : 0.9)
        .attr("stroke",       d => d.type === "seed" ? "#ffffff" : "none")
        .attr("stroke-width", 1);

    // Labels: seeds and hubs always; nodes only if score is reasonably high
    node.filter(d => d.type === "seed" || d.type === "hub" || d.score >= 0.15)
        .append("text")
        .attr("dy",           d => nodeRadius(d) + 11)
        .attr("text-anchor",  "middle")
        .attr("font-size",    d => d.type === "seed" ? 12 : d.type === "hub" ? 10 : 9)
        .attr("fill",         labelColor)
        .text(d => d.id);

    sim.on("tick", () => {
        link
            .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
        node.attr("transform", d => `translate(${d.x},${d.y})`);
    });
}

function drag(sim) {
    return d3.drag()
        .on("start", e => {
            if (!e.active) sim.alphaTarget(0.3).restart();
            e.subject.fx = e.subject.x;
            e.subject.fy = e.subject.y;
        })
        .on("drag", e => {
            e.subject.fx = e.x;
            e.subject.fy = e.y;
        })
        .on("end", e => {
            if (!e.active) sim.alphaTarget(0);
            e.subject.fx = null;
            e.subject.fy = null;
        });
}

fetch("/graph")
    .then(r => r.json())
    .then(data => {
        if (!data.error) {
            setStatus(`${data.nodes.length} nodes · ${data.links.length} edges`);
            renderGraph(data);
        }
    })
    .catch(() => {});
</script>
</body>
</html>
